[package]
name = "vigil"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Fast, opinionated dependency vulnerability scanner for JavaScript and TypeScript projects, powered by OSV.dev."
repository = "https://github.com/Crimson341/vigil"
readme = "README.md"
keywords = ["security", "vulnerability", "osv", "npm", "audit"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "vigil"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
jsonc-parser = { version = "0.26", features = ["serde"] }
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
semver = "1"
colored = "3"
rayon = "1"
glob = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
